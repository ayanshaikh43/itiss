
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Snake Game 🐍</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #171738, #34205c);
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

.game {
  width: 95%;
  max-width: 440px;
  padding: 20px;
  border-radius: 24px;
  background: #222244;
  box-shadow: 0 10px 35px #0007;
}

h1 { margin: 0 0 8px; color: #a8ff60; }

#score {
  font-size: 20px;
  margin: 12px;
}

#stats {
  color: #ffe66d;
  margin-bottom: 12px;
  font-size: 14px;
}

canvas {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1;
  background: #101c2b;
  border: 4px solid #72ff85;
  border-radius: 12px;
  display: block;
  margin: auto;
}

#message {
  min-height: 25px;
  color: #ffe66d;
  margin: 12px 0;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  margin: 4px;
  background: #a8ff60;
  color: #182018;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:hover { transform: scale(1.04); }

.controls {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  justify-content: center;
  gap: 6px;
  margin-top: 14px;
}

.controls button { margin: 0; padding: 12px 0; }
.empty { visibility: hidden; }

p { color: #d6d6f5; font-size: 13px; }
</style>
</head>

<body>
<div class="game">
  <h1>🐍 Hungry Noodle!</h1>

  <div id="score">Score: 0 🏆</div>
  <div id="stats">Speed: 1 / 10 🐢</div>

  <canvas id="board" width="360" height="360"></canvas>

  <div id="message">Eat apples. Don't eat yourself! 😂</div>

  <button onclick="startGame()">▶ Start / Restart</button>
  <button onclick="togglePause()" id="pauseBtn">⏸ Pause</button>

  <div class="controls">
    <button class="empty"> </button>
    <button onclick="turn(0,-1)">⬆️</button>
    <button class="empty"> </button>
    <button onclick="turn(-1,0)">⬅️</button>
    <button onclick="turn(0,1)">⬇️</button>
    <button onclick="turn(1,0)">➡️</button>
  </div>

  <p>Arrow keys / WASD to move. Eat 🍎 to grow and speed up!</p>
  <p>Press SPACE to pause or resume.</p>
</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const size = 18;
const cells = canvas.width / size;

// SPEED SETTINGS — change these values if you want
const START_SPEED = 180; // Starting speed in milliseconds
const SPEED_INCREASE = 5; // Speed increase per apple
const MIN_SPEED = 55; // Maximum speed limit (lower = faster)

let snake, food, dx, dy, score;
let timer = null;
let speed = START_SPEED;
let running = false;
let paused = false;
let dead = false;

const jokes = [
  "Yummy! Snake has a full belly! 🍎",
  "You're one slippery noodle! 😂",
  "That apple never stood a chance!",
  "Sssssuper eating! 🐍",
  "Snake is getting THICC! 💪",
  "Five-star restaurant? Nope. Ground apple! 😋",
  "Speed demon activated! ⚡",
  "This noodle needs a racing license! 🏎️"
];

function randomFood() {
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  } while (snake.some(s => s.x === p.x && s.y === p.y));
  return p;
}

function startGame() {
  clearInterval(timer);

  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];

  dx = 1;
  dy = 0;
  score = 0;
  speed = START_SPEED;
  food = randomFood();

  running = true;
  paused = false;
  dead = false;

  document.getElementById("message").textContent =
    "Go, noodle, go! 🐍";

  document.getElementById("pauseBtn").textContent = "⏸ Pause";

  updateStats();
  draw();
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  if (running && !paused) {
    timer = setInterval(update, speed);
  }
}

function turn(x, y) {
  if (paused || !running) return;

  // Prevent reversing into yourself
  if (x === -dx && y === -dy) return;

  dx = x;
  dy = y;
}

function togglePause() {
  if (!running && !paused) return;

  paused = !paused;

  if (paused) {
    clearInterval(timer);
    document.getElementById("message").textContent =
      "Noodle is taking a snack break! ☕";
    document.getElementById("pauseBtn").textContent = "▶ Resume";
  } else {
    document.getElementById("message").textContent =
      "Back to eating! 🍎";
    document.getElementById("pauseBtn").textContent = "⏸ Pause";
    startTimer();
  }
}

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();

  const keys = {
    arrowup: [0,-1], w: [0,-1],
    arrowdown: [0,1], s: [0,1],
    arrowleft: [-1,0], a: [-1,0],
    arrowright: [1,0], d: [1,0]
  };

  if (keys[key]) {
    e.preventDefault();
    turn(...keys[key]);
  }

  if (e.code === "Space") {
    e.preventDefault();
    togglePause();
  }

  if (key === "enter" && (!running && dead)) {
    startGame();
  }
});

function updateStats() {
  const level = Math.min(
    10,
    Math.floor((START_SPEED - speed) /
      ((START_SPEED - MIN_SPEED) / 9)) + 1
  );

  document.getElementById("score").textContent =
    "Score: " + score + " 🏆";

  document.getElementById("stats").textContent =
    "Speed: " + level + " / 10 " +
    (level < 4 ? "🐢" : level < 8 ? "🐍" : "⚡");
}

function update() {
  if (!running || paused) return;

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  const eating = head.x === food.x && head.y === food.y;

  // The tail moves away unless the snake eats food
  const body = eating ? snake : snake.slice(0, -1);

  if (
    head.x < 0 || head.y < 0 ||
    head.x >= cells || head.y >= cells ||
    body.some(s => s.x === head.x && s.y === head.y)
  ) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    food = randomFood();

    // Increase speed gradually after each apple
    speed = Math.max(MIN_SPEED, speed - SPEED_INCREASE);

    // Restart timer with the new speed
    startTimer();

    document.getElementById("message").textContent =
      jokes[Math.floor(Math.random() * jokes.length)];

    updateStats();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#101c2b";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Background grid
  ctx.strokeStyle = "#ffffff09";
  for (let i = 0; i <= canvas.width; i += size) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(canvas.width, i);
    ctx.stroke();
  }

  // Draw apple
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "18px Arial";
  ctx.fillText(
    "🍎",
    food.x * size + size / 2,
    food.y * size + size / 2
  );

  // Draw snake
  snake.forEach((s, i) => {
    const x = s.x * size;
    const y = s.y * size;

    ctx.fillStyle = i === 0
      ? "#b9ff53"
      : `hsl(${105 - i * 2}, 85%, ${Math.max(30, 58 - i)}%)`;

    ctx.beginPath();
    ctx.roundRect(x + 1, y + 1, size - 2, size - 2, 6);
    ctx.fill();

    if (i === 0) {
      // Eyes follow the direction of movement
      let eye1x, eye1y, eye2x, eye2y;

      if (dx !== 0) {
        eye1x = x + size / 2 + dx * 4;
        eye2x = eye1x;
        eye1y = y + 5;
        eye2y = y + 13;
      } else {
        eye1x = x + 5;
        eye2x = x + 13;
        eye1y = y + size / 2 + dy * 4;
        eye2y = eye1y;
      }

      ctx.fillStyle = "#17202a";
      ctx.beginPath();
      ctx.arc(eye1x, eye1y, 2, 0, Math.PI * 2);
      ctx.arc(eye2x, eye2y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  if (paused) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 145, 360, 70);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px Arial";
    ctx.fillText("PAUSED ⏸", 180, 180);
  }
}

function gameOver() {
  clearInterval(timer);
  running = false;
  paused = false;
  dead = true;

  draw();

  ctx.fillStyle = "#000b";
  ctx.fillRect(0, 125, 360, 110);

  ctx.fillStyle = "#ff7474";
  ctx.font = "bold 29px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER! 💀", 180, 165);

  ctx.fillStyle = "white";
  ctx.font = "18px Arial";
  ctx.fillText("Score: " + score, 180, 197);

  document.getElementById("message").textContent =
    score >= 100
      ? "Legendary noodle! 🏆"
      : "Oops! The noodle ate itself! 😂";

  document.getElementById("pauseBtn").textContent = "⏸ Pause";
}

startGame();
</script>
</body>
</html>
